    <script>
      // Defensive fix for extensions and test runners trying to set window.fetch
      try {
        let _customFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get() {
            return _customFetch;
          },
          set(fn) {
            _customFetch = fn;
          }
        });
